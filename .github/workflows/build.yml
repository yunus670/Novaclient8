name: Build NovaClient

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod with Gradle
        run: |
          # Eğer dosyalar NovaClient klasörünün içindeyse o dizine girer, değilse kökte çalışır
          if [ -f "build.gradle" ]; then
            gradle build --no-daemon --stacktrace
          elif [ -f "NovaClient/build.gradle" ]; then
            cd NovaClient
            gradle build --no-daemon --stacktrace
          else
            echo "Error: build.gradle not found anywhere!"
            exit 1
          fi

      - name: Prepare NovaClient.jar
        shell: bash
        run: |
          mkdir -p release
          
          # Oluşan jar dosyasını nerede olursa olsun bulup kopyalar
          JAR=$(find . -name "*.jar" -not -path "*/build/libs/*-sources.jar" -not -path "*/build/libs/*-dev.jar" -not -path "*/.gradle/*" | grep "build/libs" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Error: No mod JAR was generated."
            exit 1
          fi

          cp "$JAR" release/NovaClient.jar
          echo "Successfully found and copied: $JAR to release/NovaClient.jar"

      - name: Upload NovaClient.jar
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient
          path: release/NovaClient.jar
          if-no-files-found: error
          
